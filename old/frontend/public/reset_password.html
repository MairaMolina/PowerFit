<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Fit - Resetear Contraseña</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../src/estilos/generales.css">
    <link rel="stylesheet" href="../src/estilos/inicio_sesion.css">
</head>
<body>

    <main class="contenedor-formulario">

        <div class="logo-formulario">
            <img src="./recursos/imagenes/logo_powerfit.png" alt="Logo Power Fit">
        </div>

        <h2>Resetear Contraseña</h2>
        <p>Ingresa tu correo electrónico para recibir un enlace de reset</p>

        <form id="formulario-reset" novalidate>

            <div class="grupo-input">
                <label for="correoElectronico">Correo electrónico</label>
                <input type="email" id="correoElectronico" name="correoElectronico" placeholder="nombre@ejemplo.com" required>
            </div>

            <button type="submit" id="btn-reset" class="boton-primario">Enviar Enlace</button>

        </form>

        <p class="enlace-registro"><a href="iniciar_sesion.html">Volver al inicio de sesión</a></p>

    </main>

    <footer>
        <p>© 2025 Power Fit</p>
    </footer>

    <script type="module" src="../src/paginas/reset_password.js"></script>
</body>
</html>

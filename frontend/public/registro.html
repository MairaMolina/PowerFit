<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Fit - Registro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../src/estilos/generales.css"> <link rel="stylesheet" href="../src/estilos/registro.css"> </head>
<body>
    
    <main class="contenedor-formulario">
        <div class="logo-formulario">
            <img src="./recursos/imagenes/logo_powerfit.png" alt="Logo Power Fit">
        </div>
        <h2>Crear Cuenta</h2>
        <p>Regístrate para acceder a todas las funcionalidades</p>

        <form id="formulario-registro">
            <div class="grupo-input">
                <label for="nombreCompleto">Nombres completos</label>
                <input type="text" id="nombreCompleto" name="nombreCompleto" placeholder="Tus nombres" required>
            </div>

            <div class="grupo-input">
                <label for="nombreCompleto">Apellidos completos</label>
                <input type="text" id="apellidoCompleto" name="apellidoCompleto" placeholder="Tus apellidos" required>
            </div>

            <div>
                <label for="genero">Género</label>
                <select id="genero" name="genero" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="femenino">Femenino</option>
                <option value="masculino">Masculino</option>
                <option value="no-binario">No binario</option>
                <option value="prefiero-no-decirlo">Prefiero no decirlo</option>
                <option value="otro">Otro</option>
                </select>
            </div>

            <div class="grupo-input">
                <label for="fechaNacimiento">Fecha de Nacimiento</label>
                     <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="grupo-input">
                <label for="correoElectronico">Correo electrónico</label>
                <input type="email" id="correoElectronico" name="correoElectronico" placeholder="nombre@ejemplo.com" required>
            </div>
            <div class="grupo-input">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
                <ul id="requisitos-contrasena-lista" class="lista-requisitos">
                </ul>
            </div>
            <div class="grupo-input">
                <label for="confirmarContrasena">Confirmar contraseña</label>
                <input type="password" id="confirmarContrasena" name="confirmarContrasena" required>
            </div>

            <div class="aceptar-terminos">
                <input type="checkbox" id="aceptarTerminos" name="aceptarTerminos" required>
                <label for="aceptarTerminos">Acepto los <a href="#">términos y condiciones</a></label>
            </div>

            <button type="submit" id="btn-crear-cuenta" class="boton-primario">Crear Cuenta</button>
        </form>

        <p class="enlace-login">¿Ya tienes una cuenta? <a href="iniciar_sesion.html">Iniciar sesión</a></p>
    </main>

    <footer>
        <p>© 2025 Power Fit</p>
    </footer>

    <script type="module" src="../src/paginas/registro.js"></script>

</body>
</html>
